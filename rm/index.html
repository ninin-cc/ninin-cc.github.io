  <style>

<body class="bg-gray-50 text-slate-800 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900">
  
  <div id="root">
    <div class="loading-screen">
      <div class="animate-pulse flex flex-col items-center gap-3">
        <span class="text-3xl">🌈</span>
        <span class="text-sm font-bold tracking-widest text-slate-400">システムを起動中...</span>
      </div>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    // ==========================================
    // アイコンコンポーネント (SVG)
    // ==========================================
    const WonderIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
        <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
        <path d="M9 12H4s.55-3.03 2-5c1.62-2.2 5-3 5-3"/>
        <path d="M12 15v5s3.03-.55 5-2c2.2-1.62 3-5 3-5"/>
      </svg>
    );

    const KeeperIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    );

    const NurturerIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      </svg>
    );

    const AdapterIcon = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M19.07 4.93a10 10 0 0 0-14.14 0"/>
        <path d="M16.24 7.76a6 6 0 0 0-8.48 0"/>
        <circle cx="12" cy="12" r="1" fill="currentColor"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>
        <path d="m12 12 5-5" strokeOpacity="0.8"/>
      </svg>
    );

    const ModeIcon = ({ type, className }) => {
      switch(type) {
        case 'W': return <WonderIcon className={className} />;
        case 'K': return <KeeperIcon className={className} />;
        case 'N': return <NurturerIcon className={className} />;
        case 'A': return <AdapterIcon className={className} />;
        default: return null;
      }
    };

    const MINI_MODE_CARD_META = Object.freeze({
      W: Object.freeze({ label: 'ワンダー', color: '#F6A800', frame: '#FFC000' }),
      K: Object.freeze({ label: 'キーパー', color: '#183B5B', frame: '#183B5B' }),
      N: Object.freeze({ label: 'ナーチャー', color: '#D98BCF', frame: '#F2CFEE' }),
      A: Object.freeze({ label: 'アダプター', color: '#69C7E8', frame: '#CAEEFB' })
    });
    // report/img/qr_rm_charcoal_real.svg の33×33モジュールを、そのまま
    // data URL化する。ローカルSVG参照によるcanvas汚染を避け、画像保存にも含める。
    const RIESM_MINI_QR_MATRIX = '000000000000000000000000000000000/000000000000000000000000000000000/000000000000000000000000000000000/000000000000000000000000000000000/000011111110110111111011111110000/000010000010111000000010000010000/000010111010110110100010111010000/000010111010111001101010111010000/000010111010010100110010111010000/000010000010111011101010000010000/000011111110101010101011111110000/000000000000001000101000000000000/000011001110001000000001011110000/000010010000100101011000110100000/000011111011111110110110111000000/000011101001010010001001101100000/000000001010100110000111011110000/000011111001111110111000100100000/000000000011000110010011111000000/000000101001010010010111101100000/000011111111010110011111111000000/000000000000111101001000100000000/000011111110010110101010100000000/000010000010101100111000111110000/000010111010110110001111111100000/000010111010000101101111001110000/000010111010010101000110010100000/000010000010110010010111111100000/000011111110111110110110001110000/000000000000000000000000000000000/000000000000000000000000000000000/000000000000000000000000000000000/000000000000000000000000000000000';
    const RIESM_MINI_QR_DATA_URL = (() => {
      const modules = RIESM_MINI_QR_MATRIX.split('/').flatMap((row, y) =>
        Array.from(row, (cell, x) =>
          cell === '1' ? `<rect x="${x}" y="${y}" width="1" height="1"/>` : ''
        )
      ).join('');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="33" height="33" viewBox="0 0 33 33" shape-rendering="crispEdges"><rect width="33" height="33" fill="#fff"/><g fill="#36454F">${modules}</g></svg>`;
      return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
    })();

    function buildMiniModeCardRows(scores = {}, orderMode = 'score') {
      const sourceOrder = ['W', 'K', 'N', 'A'];
      const rows = sourceOrder.map((type, sourceIndex) => ({
        type,
        sourceIndex,
        raw: Math.max(0, Number(scores[type]) || 0),
        ...MINI_MODE_CARD_META[type]
      }));
      const total = rows.reduce((sum, row) => sum + row.raw, 0);
      const normalizedRows = rows.map(row => ({
          ...row,
          scaleMaximum: 40,
          percentage: total > 0
            ? Math.min(40, Math.round((row.raw / total) * 100))
            : 0
        }));
      return orderMode === 'fixed'
        ? normalizedRows
        : normalizedRows.sort((a, b) => b.raw - a.raw || a.sourceIndex - b.sourceIndex);
    }

    function MiniModeBalanceCard({
      scores,
      frontType,
      displayName = '今のモードバランス',
      orderMode = 'score'
    }) {
      const rows = buildMiniModeCardRows(scores, orderMode);
      const displayed = rows.map(row => row.percentage);
      const average = displayed.length
        ? displayed.reduce((sum, value) => sum + value, 0) / displayed.length
        : 0;
      const averagePosition = `${Math.max(0, Math.min(100, (average / 40) * 100))}%`;
      const frame = MINI_MODE_CARD_META[frontType]?.frame || '#827B00';

      return (
        <div
          id="riesm-mini-mode-card"
          className="riesm-mini-mode-card"
          style={{ '--mode-frame': frame, '--average-position': averagePosition }}
          aria-label={`${displayName}のモードバランス`}
        >
          <div className="riesm-mini-mode-card__inner">
            <div className="riesm-mini-mode-card__brand">RIESM™ PERSONAL MODE CARD</div>
            <div className="riesm-mini-mode-card__qr">
              <img
                src={RIESM_MINI_QR_DATA_URL}
                alt="RIESM QR"
              />
            </div>
            <div className="riesm-mini-mode-card__name">{displayName}</div>
            <div className="riesm-mini-mode-card__heading">
              <strong>4つのモード</strong>
            </div>
            <div className="riesm-mini-mode-card__graph">
              <div className="riesm-mini-mode-card__front">フロント側</div>
              <div className="riesm-mini-mode-card__average-arrow" aria-hidden="true"></div>
              <div className="riesm-mini-mode-card__guide" aria-hidden="true"></div>
              {rows.map(row => (
                <div className="riesm-mini-mode-card__row" key={row.type}>
                  <span className="riesm-mini-mode-card__label">{row.label}</span>
                  <div className="riesm-mini-mode-card__track">
                    <div
                      className="riesm-mini-mode-card__bar"
                      style={{
                        width: `${(row.percentage / row.scaleMaximum) * 100}%`,
                        background: row.type === 'K'
                          ? 'linear-gradient(90deg, #183B5B, #3D67A4)'
                          : row.color
                      }}
                    ></div>
                  </div>
                </div>
              ))}
            </div>
            <div className="riesm-mini-mode-card__back">
              バックス側
            </div>
            <div className="riesm-mini-mode-card__footer">
              <div className="riesm-mini-mode-card__creed">
                <div>すべての個性は、生きるために必要だからこそ備わり、それぞれに優劣はありません。</div>
                <div>そして固定では無く、場面、状況に応じて変化していくものです。</div>
              </div>
            </div>
            <div className="riesm-mini-mode-card__copyright">©2025 ninin consulting＆counseling</div>
          </div>
        </div>
      );
    }
    window.RiesmMiniModeBalanceCard = MiniModeBalanceCard;
    window.buildRiesmMiniModeCardRows = buildMiniModeCardRows;

    const MINI_HISTORY_STORAGE_KEY = 'riesmMiniResultHistoryV1';
    const MINI_HISTORY_LIMIT = 100;
    const MINI_HISTORY_URL_PARAM = 'rmh';
    const MINI_HISTORY_URL_VERSION = '2';
    const MINI_HISTORY_LEGACY_URL_VERSION = '1';
    const MINI_HISTORY_SCORE_SCALE = 10;
    const MINI_HISTORY_CRYPTO_CONTEXT = 'RIESM-mini-history-url-v2';
    let miniHistoryCryptoKeyPromise = null;

    function readMiniResultHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(MINI_HISTORY_STORAGE_KEY) || '[]');
        if (!Array.isArray(parsed)) return [];
        return parsed
          .filter(entry =>
            entry &&
            Number.isFinite(Number(entry.createdAt)) &&
            entry.scores &&
            ['W', 'K', 'N', 'A'].every(type => Number.isFinite(Number(entry.scores[type])))
          )
          .slice(0, MINI_HISTORY_LIMIT);
      } catch (error) {
        console.warn('RIESM miniの履歴を読み込めませんでした。', error);
        return [];
      }
    }

    function storeMiniResultHistory(entry) {
      const next = [entry, ...readMiniResultHistory()]
        .sort((a, b) => Number(b.createdAt) - Number(a.createdAt))
        .slice(0, MINI_HISTORY_LIMIT);
      try {
        localStorage.setItem(MINI_HISTORY_STORAGE_KEY, JSON.stringify(next));
      } catch (error) {
        console.warn('RIESM miniの履歴を保存できませんでした。', error);
      }
      return next;
    }

    function getMiniHistoryEntryKey(entry) {
      const second = Math.floor(Number(entry.createdAt) / 1000);
      const scoreKey = ['W', 'K', 'N', 'A']
        .map(type => Math.round((Math.max(0, Number(entry.scores?.[type])) || 0) * MINI_HISTORY_SCORE_SCALE))
        .join('-');
      return `${second}:${scoreKey}`;
    }

    function mergeMiniResultHistory(importedEntries, localEntries = readMiniResultHistory()) {
      const merged = [];
      const seen = new Set();
      [...importedEntries, ...localEntries]
        .sort((a, b) => Number(b.createdAt) - Number(a.createdAt))
        .forEach(entry => {
          const key = getMiniHistoryEntryKey(entry);
          if (seen.has(key) || merged.length >= MINI_HISTORY_LIMIT) return;
          seen.add(key);
          merged.push(entry);
        });
      return merged;
    }

    function serializeMiniResultHistory(entries) {
      const history = entries
        .filter(entry =>
          entry &&
          Number.isFinite(Number(entry.createdAt)) &&
          entry.scores &&
          ['W', 'K', 'N', 'A'].every(type => Number.isFinite(Number(entry.scores[type])))
        )
        .sort((a, b) => Number(b.createdAt) - Number(a.createdAt))
        .slice(0, MINI_HISTORY_LIMIT);
      if (!history.length) return '';

      let previousSecond = null;
      const rows = history.map((entry, index) => {
        const currentSecond = Math.floor(Number(entry.createdAt) / 1000);
        const timeValue = index === 0
          ? currentSecond
          : Math.max(0, previousSecond - currentSecond);
        previousSecond = currentSecond;
        const values = [
          timeValue,
          ...['W', 'K', 'N', 'A'].map(type =>
            Math.round(Math.max(0, Number(entry.scores[type]) || 0) * MINI_HISTORY_SCORE_SCALE)
          )
        ];
        return values.map(value => value.toString(36)).join('.');
      });
      return rows.join('~');
    }

    function compressMiniHistoryText(text) {
      if (!text) return new Uint8Array();
      const dictionary = new Map();
      const codes = [];
      let nextCode = 256;
      let current = '';

      for (const character of text) {
        const combined = current + character;
        if ((combined.length === 1 && combined.charCodeAt(0) < 256) || dictionary.has(combined)) {
          current = combined;
          continue;
        }
        codes.push(current.length === 1 ? current.charCodeAt(0) : dictionary.get(current));
        if (nextCode <= 0xffff) dictionary.set(combined, nextCode++);
        current = character;
      }
      if (current) {
        codes.push(current.length === 1 ? current.charCodeAt(0) : dictionary.get(current));
      }

      const bytes = new Uint8Array(codes.length * 2);
      codes.forEach((code, index) => {
        bytes[index * 2] = (code >> 8) & 0xff;
        bytes[index * 2 + 1] = code & 0xff;
      });
      return bytes;
    }

    function decompressMiniHistoryText(bytes) {
      if (!(bytes instanceof Uint8Array) || bytes.length % 2 !== 0) {
        throw new Error('履歴URLの圧縮データが壊れています。');
      }
      if (!bytes.length) return '';

      const codes = [];
      for (let index = 0; index < bytes.length; index += 2) {
        codes.push((bytes[index] << 8) | bytes[index + 1]);
      }

      const dictionary = new Map();
      let nextCode = 256;
      let current = String.fromCharCode(codes[0]);
      let result = current;

      for (let index = 1; index < codes.length; index += 1) {
        const code = codes[index];
        let entry;
        if (code < 256) {
          entry = String.fromCharCode(code);
        } else if (dictionary.has(code)) {
          entry = dictionary.get(code);
        } else if (code === nextCode) {
          entry = current + current[0];
        } else {
          throw new Error('履歴URLの圧縮データを展開できませんでした。');
        }
        result += entry;
        if (nextCode <= 0xffff) dictionary.set(nextCode++, current + entry[0]);
        current = entry;
      }
      return result;
    }

    function miniHistoryBytesToBase64Url(bytes) {
      let binary = '';
      bytes.forEach(byte => { binary += String.fromCharCode(byte); });
      return btoa(binary)
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/g, '');
    }

    function miniHistoryBase64UrlToBytes(value) {
      const normalized = String(value || '').replace(/-/g, '+').replace(/_/g, '/');
      const padded = normalized + '='.repeat((4 - (normalized.length % 4)) % 4);
      const binary = atob(padded);
      return Uint8Array.from(binary, character => character.charCodeAt(0));
    }

    async function getMiniHistoryCryptoKey() {
      if (!window.crypto?.subtle) {
        throw new Error('このブラウザは履歴URLの暗号化に対応していません。');
      }
      if (!miniHistoryCryptoKeyPromise) {
        miniHistoryCryptoKeyPromise = window.crypto.subtle
          .digest('SHA-256', new TextEncoder().encode(MINI_HISTORY_CRYPTO_CONTEXT))
          .then(keyBytes => window.crypto.subtle.importKey(
            'raw',
            keyBytes,
            { name: 'AES-GCM' },
            false,
            ['encrypt', 'decrypt']
          ));
      }
      return miniHistoryCryptoKeyPromise;
    }

    async function encodeMiniResultHistory(entries) {
      const serialized = serializeMiniResultHistory(entries);
      if (!serialized) return '';

      const compressed = compressMiniHistoryText(serialized);
      const iv = window.crypto.getRandomValues(new Uint8Array(12));
      const key = await getMiniHistoryCryptoKey();
      const encrypted = new Uint8Array(await window.crypto.subtle.encrypt(
        { name: 'AES-GCM', iv },
        key,
        compressed
      ));
      return [
        MINI_HISTORY_URL_VERSION,
        miniHistoryBytesToBase64Url(iv),
        miniHistoryBytesToBase64Url(encrypted)
      ].join('~');
    }

    function deserializeMiniResultHistory(serialized) {
      if (typeof serialized !== 'string' || !serialized.trim()) return [];
      const parts = serialized.trim().split('~');
      let previousSecond = null;
      return parts.slice(0, MINI_HISTORY_LIMIT).map((row, index) => {
        const values = row.split('.').map(value => parseInt(value, 36));
        if (
          values.length !== 5 ||
          values.some(value => !Number.isFinite(value) || value < 0)
        ) {
          throw new Error('履歴URLのデータを読み取れませんでした。');
        }
        const currentSecond = index === 0
          ? values[0]
          : previousSecond - values[0];
        if (!Number.isFinite(currentSecond) || currentSecond <= 0) {
          throw new Error('履歴URLの日時を読み取れませんでした。');
        }
        previousSecond = currentSecond;
        const scores = Object.fromEntries(
          ['W', 'K', 'N', 'A'].map((type, scoreIndex) => [
            type,
            values[scoreIndex + 1] / MINI_HISTORY_SCORE_SCALE
          ])
        );
        return {
          id: `url-${currentSecond}-${values.slice(1).join('-')}`,
          createdAt: currentSecond * 1000,
          scores
        };
      });
    }

    async function decodeMiniResultHistory(payload) {
      if (typeof payload !== 'string' || !payload.trim()) return [];
      const parts = payload.trim().split('~');
      const version = parts.shift();

      if (version === MINI_HISTORY_LEGACY_URL_VERSION) {
        return deserializeMiniResultHistory(parts.join('~'));
      }
      if (version !== MINI_HISTORY_URL_VERSION || parts.length !== 2) {
        throw new Error('対応していない履歴URLです。');
      }

      const iv = miniHistoryBase64UrlToBytes(parts[0]);
      const encrypted = miniHistoryBase64UrlToBytes(parts[1]);
      if (iv.length !== 12 || encrypted.length < 17 || encrypted.length > 50000) {
        throw new Error('履歴URLの暗号化データが壊れています。');
      }
      const key = await getMiniHistoryCryptoKey();
      const decrypted = new Uint8Array(await window.crypto.subtle.decrypt(
        { name: 'AES-GCM', iv },
        key,
        encrypted
      ));
      return deserializeMiniResultHistory(decompressMiniHistoryText(decrypted));
    }

    function initializeMiniResultHistory() {
      return readMiniResultHistory();
    }

    async function importMiniResultHistoryFromUrl() {
      const localEntries = readMiniResultHistory();
      try {
        const url = new URL(window.location.href);
        const payload = url.searchParams.get(MINI_HISTORY_URL_PARAM);
        if (!payload) return localEntries;
        const importedEntries = await decodeMiniResultHistory(payload);
        const merged = mergeMiniResultHistory(importedEntries, localEntries);
        localStorage.setItem(MINI_HISTORY_STORAGE_KEY, JSON.stringify(merged));
        return merged;
      } catch (error) {
        console.warn('URLに保存されたRIESM miniの履歴を復元できませんでした。', error);
        return localEntries;
      }
    }

    function formatMiniHistoryDate(timestamp) {
      const parts = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).formatToParts(new Date(timestamp));
      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      const weekday = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        weekday: 'short'
      }).format(new Date(timestamp));
      return `${values.year}/${values.month}/${values.day} ${weekday}曜日 ${values.hour}:${values.minute}`;
    }

    function getMiniHistoryModeOrder(scores = {}) {
      return ['W', 'K', 'N', 'A']
        .map((type, index) => ({ type, index, value: Math.max(0, Number(scores[type]) || 0) }))
        .sort((a, b) => a.value - b.value || b.index - a.index)
        .map(item => item.type);
    }

    function formatMiniHistoryGraphDate(timestamp) {
      const parts = new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(new Date(timestamp));
      const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
      return `${values.year}/${values.month}/${values.day}`;
    }

    function getMiniHistoryPercentages(scores = {}) {
      const values = Object.fromEntries(
        ['W', 'K', 'N', 'A'].map(type => [type, Math.max(0, Number(scores[type]) || 0)])
      );
      const total = Object.values(values).reduce((sum, value) => sum + value, 0);
      if (total <= 0) return { W: 0, K: 0, N: 0, A: 0 };
      return Object.fromEntries(
        Object.entries(values).map(([type, value]) => [type, (value / total) * 100])
      );
    }

      const height = Math.max(220, top + Math.max(1, history.length - 1) * rowHeight + bottom);
      const xForPercent = (value) => {
        const clamped = Math.max(-10, Math.min(40, Number(value) || 0));
        return plotLeft + ((clamped + 10) / 50) * (plotRight - plotLeft);
      };
      const gridValues = [-10, 0, 10, 20, 30, 40];
      const modeTypes = ['W', 'K', 'N', 'A'];

      return (
        <div className="riesm-history-trend rounded-2xl border border-slate-200 bg-white p-3 sm:p-4">

            {gridValues.map(value => (
              <line
                key={value}
                x1={xForPercent(value)}
                y1="32"
                x2={xForPercent(value)}
                y2={height - 12}
                stroke={value === 0 ? '#cbd5e1' : '#e2e8f0'}
                strokeWidth={value === 0 ? '1.4' : '1'}
              />
            ))}

            {history.map((entry, index) => {
              const y = top + index * rowHeight;
              return (
                <g key={entry.id}>
                  <text x="6" y={y + 4} fill="#334155" fontSize="12" fontWeight="700">
                    {formatMiniHistoryGraphDate(entry.createdAt)}
                  </text>

                </g>
              );
            })}

            {modeTypes.map(type => {
              const points = history.map((entry, index) => {
                const percentages = getMiniHistoryPercentages(entry.scores);
                return `${xForPercent(percentages[type])},${top + index * rowHeight}`;
              }).join(' ');

              return (
                <polyline
                  key={type}
                  points={points}
                  fill="none"
                  stroke={MINI_MODE_CARD_META[type].color}
                  strokeWidth="4"
                  strokeLinecap="round"
                  strokeLinejoin="round"

              </span>
            ))}
          </div>
        </div>
      );
    }

    function normalizeWorkshopLicenseCode(value) {
      return String(value || '')
        .trim()
        .replace(/^[?#]/, '')
        .split('&')[0]
        .split('=')[0]
        .replace(/_/g, '-')
        .toUpperCase();
    }

    function getWorkshopLicenseAlias(value) {
      const code = normalizeWorkshopLicenseCode(value);
      const match = code.match(/(?:[A-Z]+)-?(\d{3,4})|\b(\d{3,4})\b/i);
      return match ? match[1] || match[2] : '';
    }

    function getWorkshopLicenseAliasKey(value) {
      const alias = getWorkshopLicenseAlias(value);
      return alias ? String(Number(alias)) : '';
    }

    function getWorkshopLicenseRequestCode() {
      const params = new URLSearchParams(window.location.search);
      const rawCode = params.get('id') ||
        params.get('code') ||
        params.get('amb') ||
        Array.from(params.keys())[0] ||
        window.location.hash;
      return getWorkshopLicenseAlias(rawCode);
    }

    function getWorkshopLicenseSource(member) {
      return [
        member && member.certification,
        member && member.certificationType,
        member && member.certificationNumber,
        member && member.riesmNumber,
        member && member.riesmRole,
        member && member.id
      ].filter(Boolean).join(' ');
    }

    function getWorkshopLicenseCode(member) {
      const source = getWorkshopLicenseSource(member);
      const match = source.match(/\b([A-Z]+)-?(\d{3,4})\b/i);
      if (!match) return '';
      const prefix = match[1].toUpperCase() === 'R' ? 'AMB' : match[1].toUpperCase();
      return prefix + '-' + match[2];
    }

        setStarted(true);
      };

      const startTutorial = () => {
        setCurrentQuestions([]);
        setCurrentIndex(0);
        setAnswers([]);
        setResultType(null);
        setResultScores(null);
        setModeCardName('今のモードバランス');
        setModeCardNameInput('');
        setSelectedChoiceIndex(null);
        setTempSelectedChoiceIndex(null);
        setIsPractice(true);
        setTutorialCompleted(false);
        setHoverPos(50);
        setStarted(true);
      };

      const returnToTop = () => {
        setStarted(false);
        setIsPractice(false);
        setTutorialCompleted(false);
        setSelectedChoiceIndex(null);
        setTempSelectedChoiceIndex(null);
        setHoverPos(50);
      };

      const handleAnswer = useCallback((scoreUpdates) => {
        const newAnswers = [...answers, scoreUpdates];
        setAnswers(newAnswers);
        if (currentIndex < currentQuestions.length - 1) {
          setCurrentIndex(currentIndex + 1);
        } else {
          calculateResult(newAnswers);
        }
      }, [answers, currentIndex, currentQuestions]);

      const handleBack = () => {
        // チュートリアル中、または本番の1問目の場合はトップ画面に戻る
        if (isPractice || currentIndex === 0) {
          returnToTop();
          return;
        }
        // 本番の2問目以降は、1つ前の質問に戻る
        if (currentIndex > 0) {
          setSelectedChoiceIndex(null);
          setTempSelectedChoiceIndex(null);
          setCurrentIndex(currentIndex - 1);
          setAnswers(answers.slice(0, -1));
        }
      };

      // --- 6択ボタン用 二度タップ選択の処理 ---
      const handleChoiceSelect = (choice) => {
        if (selectedChoiceIndex !== null) return; 

        if (tempSelectedChoiceIndex !== choice.index) {
          // 1回目のタップ (仮選択)
          setTempSelectedChoiceIndex(choice.index);
        } else {
          // 2回目のタップ (本決定)
          setSelectedChoiceIndex(choice.index);
          setTempSelectedChoiceIndex(null);
          
          window.setTimeout(() => {
            if (isPractice) {
              setTutorialCompleted(true);
              return;
            }
            handleAnswer(choice.scoreUpdates);
          }, 350); 
        }
      };

      const calculateResult = (finalAnswers) => {
        const scores = { W: 0, K: 0, N: 0, A: 0 };
        finalAnswers.forEach(updates => {
          updates.forEach(update => { if (scores[update.type] !== undefined) scores[update.type] += update.weight; });
        });
        const sortedTypes = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
        const maxType = sortedTypes[0];
        const maxScore = scores[maxType];
        const secondType = sortedTypes[1];
        const secondScore = scores[secondType];
        const minType = sortedTypes[3];

        let front = maxType; 
        let isDouble = false;
        let frontKey = "";

        if (maxScore > 0) {
          const ratio = secondScore / maxScore;
          if (ratio >= 0.85) {
            isDouble = true;
            frontKey = [maxType, secondType].sort().join('_');
          }
        }

        const detailIndex = Math.floor(Math.random() * 3);
        const nextResultType = { front: front, second: secondType, back: minType, isDouble: isDouble, frontKey: frontKey, detailIndex: detailIndex };
        setResultScores(scores);
        setResultType(nextResultType);
        const createdAt = Date.now();
        setResultHistory(storeMiniResultHistory({
          id: `${createdAt}-${Math.random().toString(36).slice(2, 9)}`,
          createdAt,
          scores,
          resultType: nextResultType
        }));
      };

      const showToast = (message) => {
        setToastMessage(message);
        setTimeout(() => setToastMessage(''), 5000);
      };

      const copyTextToClipboard = async (text) => {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.setAttribute('readonly', '');
        textArea.style.position = 'fixed';
        textArea.style.left = '-999999px';
        document.body.appendChild(textArea);
        textArea.select();
        const copied = document.execCommand('copy');
        textArea.remove();
        if (!copied) throw new Error('コピーに失敗しました。');
      };

      const handleCreateHistoryTransferUrl = async () => {
        setIsCreatingHistoryTransferUrl(true);
        setHistoryTransferCopyState('creating');
        try {
          const history = mergeMiniResultHistory(resultHistory, readMiniResultHistory());
          const payload = await encodeMiniResultHistory(history);
          if (!payload) {
            setHistoryTransferCopyState('idle');
            showToast('保存できる結果がまだありません。先に「いまの自分を観る」を実施してください。');
            return;
          }

          const url = new URL(window.location.href);
          url.searchParams.set(MINI_HISTORY_URL_PARAM, payload);
          const transferUrl = url.toString();
          setHistoryTransferUrl(transferUrl);
          try {
            await copyTextToClipboard(transferUrl);
            setHistoryTransferCopyState('copied');
            showToast(`過去${history.length}件の履歴を圧縮・暗号化したURLをコピーしました。`);
          } catch (copyError) {
            console.warn('履歴URLを自動コピーできませんでした。', copyError);
            setHistoryTransferCopyState('ready');
            showToast('URLを作成しました。表示されたURLをコピーして保存してください。');
          }
        } catch (error) {
          console.warn('履歴URLを作成できませんでした。', error);
          setHistoryTransferCopyState('error');
          showToast('履歴URLを作成できませんでした。このブラウザの暗号化機能をご確認ください。');
        } finally {
          setIsCreatingHistoryTransferUrl(false);
        }
      };

      const handleApplyModeCardName = () => {
        const normalizedName = modeCardNameInput
          .replace(/[\r\n\t]+/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        if (!normalizedName) {
          showToast('お名前を入力してください。');
          return;
        }
        setModeCardName(normalizedName);
        showToast('カードのお名前を変更しました。');
      };

      const handleSaveModeCard = async () => {
        const element = document.getElementById('riesm-mini-mode-card');
        if (!element || !window.html2canvas) {
          showToast('エラー：カード画像の生成に失敗しました。');
          return;
        }

        setIsSavingModeCard(true);
        let exportHost = null;
        try {
          await new Promise(resolve => setTimeout(resolve, 100));

          // Always render from the same reference width. Rendering the responsive
          // on-screen element directly makes the downloaded PNG depend on the
          // phone/PC viewport and can change text wrapping and vertical rhythm.
          exportHost = document.createElement('div');
          exportHost.setAttribute('aria-hidden', 'true');
          Object.assign(exportHost.style, {
            position: 'fixed',
            left: '-10000px',
            top: '0',
            width: '455px',
            height: 'auto',
            pointerEvents: 'none'
          });
          const exportCard = element.cloneNode(true);
          exportCard.removeAttribute('id');
          exportCard.style.width = '455px';
          exportHost.appendChild(exportCard);
          document.body.appendChild(exportHost);

          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }
          await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));

          const canvas = await window.html2canvas(exportCard, {
            scale: 3,
            useCORS: true,
            backgroundColor: '#fffdf8',
            logging: false,
            width: 455,
            height: 275,
            windowWidth: 455,
            windowHeight: 275
          });
          const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(value => value ? resolve(value) : reject(new Error('PNG変換に失敗しました。')), 'image/png');
          });
          const safeName = modeCardName
            .replace(/[\\/:*?"<>|]/g, '_')
            .replace(/\s+/g, '_')
            .slice(0, 60) || '今のモードバランス';
          const objectUrl = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = objectUrl;
          link.download = `RIESM_ModeCard_${safeName}.png`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
          showToast('パーソナルモードカードを画像で保存しました。');
        } catch (error) {
          console.error('ModeCard save failed:', error);
          showToast('エラー：カード画像の生成に失敗しました。もう一度お試しください。');
        } finally {
          if (exportHost) exportHost.remove();
          setIsSavingModeCard(false);
        }
      };

      const handleShare = async () => {
        setIsSharing(true);
        const element = document.getElementById('capture-area');
        if (!element || !window.html2canvas) {
          showToast('エラー：画像の生成に失敗しました。');
          setIsSharing(false);
          return;

        try {

          const canvas = await window.html2canvas(element, {

            backgroundColor: '#ffffff',

          if (navigator.canShare && navigator.canShare({ files: [file] })) {

              console.log('Share canceled or failed:', shareError);

          console.error('Share failed:', error);
          showToast('エラー：画像の生成に失敗しました。もう一度お試しください。');
        } finally {
          setIsSharing(false);
        }
      };

      const fallbackShare = (text, dataUrl) => {

      // ==========================================

        return (

                    colorMode === 'natural'

                  🌿 ナチュラル
                </button>
                <button

                    colorMode === 'colorful' 
                      ? 'bg-white text-slate-800 font-extrabold shadow-md' 
                      : 'bg-white text-slate-500 font-bold hover:bg-slate-50'
                  }`}
                >
                  🎨 カラフル
                </button>
              </div>
              
              <p className="relative z-10 text-slate-600 mb-8 font-medium leading-relaxed text-sm sm:text-base">
                今のあなたの「心のモード（フロント）」を測ります。<br/>

              <div className="relative z-10 space-y-4 mb-10">

                  colorMode === 'colorful'
                    ? 'bg-gradient-to-r from-amber-400 to-pink-500 text-white hover:opacity-90'

                  <span>いまの自分を観る</span>

                <button onClick={() => {

                  colorMode === 'colorful'
                    ? 'bg-gradient-to-r from-amber-400 to-pink-500 text-white hover:opacity-90'

                  <span>前回までの結果を観る</span>
                </button>
                <div className="rounded-xl border border-slate-200 bg-slate-50/80 p-3 shadow-sm">
                  <button

                    onClick={handleCreateHistoryTransferUrl}
                    disabled={isCreatingHistoryTransferUrl}
                    className={`flex w-full items-center justify-center gap-2 rounded-lg border px-4 py-2.5 text-sm font-bold shadow-sm transition active:scale-[0.99] disabled:cursor-wait disabled:opacity-60 sm:text-base ${
                      historyTransferCopyState === 'copied'
                        ? 'border-emerald-300 bg-emerald-100 text-emerald-900'
                        : 'border-emerald-300 bg-emerald-50 text-emerald-900 hover:border-emerald-400 hover:bg-emerald-100'
                    }`}
                  >
                    <span aria-hidden="true">🔗</span>
                    <span className="flex flex-col items-center leading-tight">
                      <span>URLで保存・ブラウザ移動</span>
                      <span className="mt-1 text-[10px] font-bold text-emerald-700 sm:text-xs">
                        {isCreatingHistoryTransferUrl
                          ? 'URLを作成してコピー中...'
                          : historyTransferCopyState === 'copied'
                            ? '✅コピーされました'
                            : 'ここを押すとURLがコピーされます'}
                      </span>
                    </span>
                  </button>
                  <p className="mt-2 px-1 text-left text-[11px] leading-relaxed text-slate-500 sm:text-xs">
                    過去100件までの履歴を圧縮・暗号化してURLに保存します。別のブラウザでURLを開くと履歴を復元できます。
                  </p>
                  <div aria-live="polite" role="status">
                    {historyTransferCopyState === 'ready' && (

                      </p>

                    {historyTransferCopyState === 'error' && (

                      </p>

                  </div>
                  {historyTransferUrl && (

                      <label htmlFor="history-transfer-url" className="mb-1 block text-left text-[11px] font-bold text-emerald-800">

                      </label>
                      <textarea

                        aria-label="履歴を含む保存用URL"

                      <button

                      >

                </div>
                <WorkshopLicenseCard />
                <button type="button" onClick={() => setShowWorkshopGuide(true)} className="w-full rounded-2xl border border-indigo-100 bg-indigo-50/80 px-4 py-3 text-left shadow-sm transition hover:-translate-y-0.5 hover:bg-indigo-50 hover:shadow-md">

                  <span className="text-sm">📱</span> ブラウザのメニューから【ホーム画面に追加】すると便利です

              {/* 完全版への導線エリア */}
              <div className="relative z-10 rounded-2xl p-5 border border-slate-200 bg-white text-left shadow-sm hover:shadow-md transition-shadow">
                <p className="text-[13px] text-slate-600 mb-4 leading-relaxed font-medium">
                  完全版RIESM™では、4つのモードに加えて、6つの興味の蛇口。そして24の役割「あなただけのコックピット」により<br className="hidden sm:block"/>
                  <span className="font-bold bg-gradient-to-r from-indigo-100 via-purple-100 to-pink-100 px-1.5 py-0.5 rounded text-slate-800">「どんな役割で力を発揮しやすいか・どうしたら自然にラクにできるのか？」</span>まで整理できます。

              <div className="relative z-10 mt-8 text-center space-y-4">

                  <a href="https://ninin-cc.github.io/riesm.html" target="_blank" rel="noopener noreferrer" className="text-[10px] sm:text-xs text-slate-400 font-medium hover:text-slate-600 transition-colors">

      }

      // ==========================================
      // 画面描画: 結果画面
      // ==========================================
      if (resultType) {
        let result;
        if (resultType.isDouble) {
          const frontData = resultsData[resultType.front];
          const secondData = resultsData[resultType.second];
          const themeKey = resultType.frontKey;
          
          result = {
            title: `${frontData.title} ＆ ${secondData.title}`,
            subTitle: `（${frontData.subTitle.replace(/[（）]/g, '')} × ${secondData.subTitle.replace(/[（）]/g, '')}）`,
            detail: frontData.detail.map(d => `${d}\n\n${secondAdditions[resultType.second]}`),

          };
        } else {
          result = resultsData[resultType.front];
        }

        const t = result.theme;
        const backResult = backsData[resultType.back];

        return (
          <div className={`min-h-screen flex items-center justify-center p-3 sm:p-6 py-8 sm:py-12 transition-colors duration-1000 ${t.bg}`}>
            <div className="max-w-lg w-full animate-fade-in relative">
              
              {toastMessage && (
                <div className="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-6 py-4 rounded-xl shadow-2xl z-50 text-sm font-bold text-center whitespace-pre-line w-[90%] max-w-sm border border-slate-600 animate-fade-in">
                  {toastMessage}
                </div>
              )}
              
              <div id="result-card" className={`bg-white rounded-3xl shadow-2xl overflow-hidden border-2 ${t.border}`}>
                
                {/* --- ▼▼▼ ここからキャプチャ範囲 ▼▼▼ --- */}
                <div id="capture-area" className="bg-white">
                  <div className={`px-6 py-8 sm:p-10 text-center relative overflow-hidden bg-gradient-to-br ${t.header} text-white`}>
                    {/* 背景装飾 */}
                    <div className="absolute top-0 left-0 w-full h-full opacity-20 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-white to-transparent mix-blend-overlay"></div>
                    <div className="absolute -bottom-10 -left-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
                    
                    <h2 className="text-xs sm:text-sm font-bold tracking-[0.2em] text-white/90 mb-4 relative z-10">
                      今の【フロント】
                    </h2>
                    
                    <div className="flex items-center justify-center gap-4 mb-4 relative z-10">
                      <ModeIcon type={resultType.front} className="w-10 h-10 sm:w-12 sm:h-12 drop-shadow-md" />
                      {resultType.isDouble && (
                        <>
                          <span className="text-2xl font-bold opacity-70">+</span>
                          <ModeIcon type={resultType.second} className="w-10 h-10 sm:w-12 sm:h-12 drop-shadow-md" />
                        </>
                      )}
                    </div>
                    
                    <h1 className="text-2xl sm:text-3xl font-extrabold relative z-10 drop-shadow-md leading-tight">
                      {result.title}
                      {result.subTitle && (
                        <>
                          <br />
                          <span className="text-base sm:text-lg font-bold opacity-90 block mt-1">{result.subTitle}</span>
                        </>
                      )}
                    </h1>
                  </div>
                  
                  <div className="p-5 sm:p-8 pb-3 sm:pb-4">
                    <MiniModeBalanceCard
                      scores={resultScores}
                      frontType={resultType.front}
                      displayName={modeCardName}
                    />
                    {/* ウォーターマーク（キャプチャ時のみ表示） */}
                    <div id="capture-watermark" style={{ display: 'none' }} className="text-center mt-6 pb-2">
                      <p className="text-xs font-bold text-slate-500 mb-2">
                        皆さんも体験してみてください。<br className="sm:hidden" />少し詳細なモードバランスの解説も出てきます🔍
                      </p>
                      <p className="text-[10px] text-slate-400/80 font-medium tracking-wide">
                        🌈 RIESM™ mini ©2026 ninin consulting＆counseling
                      </p>
                    </div>
                  </div>
                </div>
                {/* --- ▲▲▲ ここまでキャプチャ範囲 ▲▲▲ --- */}

                {/* --- ▼▼▼ ここからキャプチャしない範囲 (Web画面のみ) ▼▼▼ --- */}
                <div className="px-5 pt-4 sm:px-8" data-html2canvas-ignore="true">
                  <p className="rounded-xl border border-amber-100 bg-amber-50 px-4 py-3 text-center text-xs font-bold leading-relaxed text-amber-950 sm:text-sm">
                    このアプリを「ワークショップ」で使うときのトリセツは、TOPページにございます。
                  </p>
                </div>
                <div className="px-5 sm:px-8" data-html2canvas-ignore="true">
                  <div className="riesm-mini-mode-card-tools">
                    <div className="riesm-mini-mode-card-tools__row">
                      <input
                        type="text"
                        value={modeCardNameInput}
                        onChange={(event) => setModeCardNameInput(event.target.value)}
                        onKeyDown={(event) => {
                          if (event.key === 'Enter') handleApplyModeCardName();
                        }}
                        placeholder="カードに表示するお名前"
                        maxLength="40"
                        aria-label="カードに表示するお名前"
                      />
                      <button
                        type="button"
                        className="riesm-mini-mode-card-tools__apply"
                        onClick={handleApplyModeCardName}
                      >
                        決定
                      </button>
                    </div>
                    <button
                      type="button"
                      className="riesm-mini-mode-card-tools__save"
                      onClick={handleSaveModeCard}
                      disabled={isSavingModeCard}
                    >
                      {isSavingModeCard ? 'カード画像を作成中...' : 'カードを画像で保存'}
                    </button>
                  </div>
                </div>
                <div className="px-5 sm:px-8 pb-0" data-html2canvas-ignore="true">
                  <div className={`rounded-2xl p-5 sm:p-7 mb-5 border border-white shadow-sm ${t.cardBg}`}>
                    <p className={`leading-relaxed text-[14px] sm:text-base font-medium whitespace-pre-line ${t.text}`}>
                      {result.detail[resultType.detailIndex]}
                    </p>
                  </div>
                </div>

                <div className="px-5 sm:px-8 pb-5 space-y-3 sm:space-y-4" data-html2canvas-ignore="true">
                  <button onClick={handleShare} disabled={isSharing} className={`flex items-center justify-center gap-2 w-full py-4 px-6 rounded-xl font-bold transition-all text-sm sm:text-base text-white shadow-md hover:shadow-lg active:scale-[0.98] ${isSharing ? 'bg-slate-400 cursor-not-allowed' : 'bg-slate-800 hover:bg-slate-700'}`}>
                    <ShareIcon /> {isSharing ? '画像を作成中...' : '今のフロントを保存・シェアする'}
                  </button>
                  
                  <button onClick={startQuiz} className={`flex items-center justify-center gap-2 w-full py-4 px-6 rounded-xl font-bold transition-all text-sm sm:text-base border-2 border-transparent active:scale-[0.98] ${t.btnBg} ${t.text} ${t.btnHover}`}>
                    <RefreshCwIcon /> もう一度観る
                  </button>

                  {/* 完全版への導線 */}
                  <div className={`mt-8 p-5 sm:p-6 rounded-2xl border-2 ${t.border} bg-white text-left shadow-sm hover:shadow-md transition-shadow`}>
                    <p className={`text-[13px] sm:text-sm font-medium mb-4 leading-relaxed ${t.text}`}>
                      完全版RIESM™では、4つのモードに加えて、6つの興味の蛇口。そして24の役割「あなただけのコックピット」により<br className="hidden sm:block"/>
                      <span className="font-bold bg-gradient-to-r from-indigo-100 via-purple-100 to-pink-100 px-1.5 py-0.5 rounded">「どんな役割で力を発揮しやすいか・どうしたら自然にラクにできるのか？」</span>まで整理できます。
                    </p>
                    <a href="https://ninin-cc.github.io/riesm.html" target="_blank" rel="noopener noreferrer" className={`flex items-center justify-between p-4 rounded-xl shadow-sm hover:shadow-md transition-all group text-white bg-gradient-to-r ${t.header}`}>
                      <div>
                        <div className="text-[10px] sm:text-xs font-bold mb-1 opacity-90">仕事や人間関係で本格的に活かしたい方は</div>
                        <div className="text-sm sm:text-base font-bold">🌈 完全版RIESM™へ</div>
                      </div>
                      <div className="opacity-80 group-hover:opacity-100 transform group-hover:translate-x-1 transition-all"><ExternalLinkIcon /></div>
                    </a>
                  </div>
                </div>

                <div className="px-5 sm:px-8 pb-8" data-html2canvas-ignore="true">
                  <div className={`rounded-2xl p-5 sm:p-7 mb-6 border border-white shadow-sm ${t.cardBg}`}>
                    <h4 className={`font-bold text-sm sm:text-base mb-4 opacity-90 ${t.text} flex items-center gap-2`}>
                      <span className="bg-white/50 p-1.5 rounded-lg">▼</span> バックスについて
                    </h4>
                    <p className={`text-[13px] sm:text-sm font-medium opacity-80 whitespace-pre-line leading-relaxed ${t.text}`}>
                      {backResult.desc}
                    </p>
                    
                    <div className={`mt-6 p-4 sm:p-5 rounded-xl bg-white/60 border border-white shadow-sm`}>
                       <p className={`text-[11px] sm:text-xs font-bold opacity-90 leading-relaxed ${t.text}`}>
                         💡 観測のヒント：【バックス】は何度実施してもあまり変わらない傾向があります。自分が何を避け、何を守ろうとしているのか。何度か観測する中で、そんな自分との対話も楽しんでみてくださいね。
                       </p>
                    </div>
                  </div>

                  <div className="text-center pt-2 space-y-3">
                    <a href="https://note.com/ninin2025/n/n236a6f29ad63" target="_blank" rel="noopener noreferrer" className={`text-xs font-bold opacity-60 hover:opacity-100 transition-opacity inline-flex items-center gap-1 ${t.text}`}>
                      🌈RIESM™について詳しく知る(note) <ExternalLinkIcon />
                    </a>
                    <div>
                      <a href="https://ninin-cc.github.io/riesm.html" target="_blank" rel="noopener noreferrer" className={`text-[10px] sm:text-xs font-medium opacity-50 hover:opacity-100 transition-opacity ${t.text}`}>
                        © 2026 ninin consulting＆counseling
                      </a>
                    </div>
                  </div>
                </div>
                {/* --- ▲▲▲ キャプチャしない範囲ここまで ▲▲▲ --- */}
              </div>
            </div>
          </div>
        );
      }

      // ==========================================
      // 画面描画: 質問画面
      // ==========================================
      const q = isPractice ? practiceQuestion : currentQuestions[currentIndex];
      const progress = isPractice ? 4 : ((currentIndex + 1) / currentQuestions.length) * 100;
      const labelStrong = q.isSituation ? "に、強く惹かれる" : "と、強くそう思う";
      const labelMid = q.isSituation ? "に、惹かれる" : "と、そう思う";

      const topType = q.options[0].type;
      const bottomType = q.options[1].type;
      
      // カラーモードによる色の出し分け
      const topColorRGB = colorMode === 'colorful' ? bgColors[topType] : '110, 231, 183'; // emerald-300
      const bottomColorRGB = colorMode === 'colorful' ? bgColors[bottomType] : '190, 242, 100'; // lime-300
      
      const answerChoices = [
        { index: 0, hoverPos: 15, caption: 'かなりA', topSize: 'w-10 h-10 sm:w-12 sm:h-12', bottomSize: null, scoreUpdates: [{ type: topType, weight: 4 }], ariaLabel: `【${q.options[0].text}】${labelStrong}` },
        { index: 1, hoverPos: 30, caption: 'A', topSize: 'w-8 h-8 sm:w-10 sm:h-10', bottomSize: null, scoreUpdates: [{ type: topType, weight: 3 }], ariaLabel: `【${q.options[0].text}】${labelMid}` },
        { index: 2, hoverPos: 45, caption: 'ややA', topSize: 'w-7 h-7 sm:w-8 sm:h-8', bottomSize: 'w-4 h-4 sm:w-5 sm:h-5', scoreUpdates: [{ type: topType, weight: 2 }, { type: bottomType, weight: 1 }], ariaLabel: `どちらかといえば【${q.options[0].text}】` },
        { index: 3, hoverPos: 55, caption: 'ややB', topSize: 'w-4 h-4 sm:w-5 sm:h-5', bottomSize: 'w-7 h-7 sm:w-8 sm:h-8', scoreUpdates: [{ type: bottomType, weight: 2 }, { type: topType, weight: 1 }], ariaLabel: `どちらかといえば【${q.options[1].text}】` },
        { index: 4, hoverPos: 70, caption: 'B', topSize: null, bottomSize: 'w-8 h-8 sm:w-10 sm:h-10', scoreUpdates: [{ type: bottomType, weight: 3 }], ariaLabel: `【${q.options[1].text}】${labelMid}` },
        { index: 5, hoverPos: 85, caption: 'かなりB', topSize: null, bottomSize: 'w-10 h-10 sm:w-12 sm:h-12', scoreUpdates: [{ type: bottomType, weight: 4 }], ariaLabel: `【${q.options[1].text}】${labelStrong}` }
      ];

      return (
        <div className="min-h-screen flex items-center justify-center p-3 sm:p-4 bg-slate-50 transition-colors duration-1000 selection:bg-indigo-100">
          <div className="max-w-md w-full bg-white/95 rounded-3xl shadow-2xl overflow-hidden border border-white animate-fade-in relative backdrop-blur-xl">
            
            {/* 背景グラデーション: 上 */}
            <div 
              className="absolute top-0 left-0 w-full transition-all duration-700 ease-in-out pointer-events-none"
              style={{ 
                height: `${100 - hoverPos + 10}%`, 
                background: `linear-gradient(to bottom, rgba(${topColorRGB}, 0.25) 0%, rgba(${topColorRGB}, 0) 100%)`,
              }}
            ></div>

            {/* 背景グラデーション: 下 */}
            <div 
              className="absolute bottom-0 left-0 w-full transition-all duration-700 ease-in-out pointer-events-none"
              style={{ 
                height: `${hoverPos + 10}%`, 
                background: `linear-gradient(to top, rgba(${bottomColorRGB}, 0.25) 0%, rgba(${bottomColorRGB}, 0) 100%)`,
              }}
            ></div>

            {/* プログレスバー */}
            <div className="relative z-20 h-2 bg-slate-100/50 w-full">
              <div className="h-full bg-indigo-500/80 transition-all duration-500 ease-out" style={{ width: `${progress}%` }}></div>
            </div>

            <div className="relative z-10 p-4 sm:p-8 pb-4 sm:pb-6">
              <div className="text-[11px] sm:text-xs font-bold text-slate-400 mb-3 sm:mb-4 tracking-[0.2em] flex justify-between px-2">
                <span>{isPractice ? 'PRACTICE' : 'QUESTION'}</span>
                <span>{isPractice ? '練習' : `${currentIndex + 1} / ${currentQuestions.length}`}</span>
              </div>
              
              {/* ▼ ノート風背景を適用した設問エリア ▼ */}
              <div className="notebook-bg min-h-[6rem] sm:min-h-[8rem] rounded-xl sm:rounded-2xl shadow-sm border border-slate-200/80 mb-4 sm:mb-6 w-full flex items-center relative z-10">
                <div className="px-6 sm:px-8 py-5 w-full">
                  <p className="text-[15px] sm:text-[17px] font-bold text-slate-700 leading-[32px] tracking-wide relative z-10 text-center">
                    {q.text}
                  </p>
                </div>
              </div>
              
              <div className="space-y-4 sm:space-y-5 animate-fade-in relative z-10">
                {/* 選択肢 A (付箋風デザイン) */}
                <div className="relative h-full w-full rounded-xl sm:rounded-2xl border border-white/70 bg-white/70 shadow-sm backdrop-blur-md flex items-center min-h-[4.5rem] overflow-hidden mb-2">
                  <div
                    className="absolute top-0 left-0 h-full w-8 sm:w-10 flex items-center justify-center text-sm sm:text-base font-black text-white shadow-md z-10"
                    style={{ backgroundColor: `rgb(${topColorRGB})` }}
                  >
                    A
                  </div>
                  {/* px-10 sm:px-12 と relative z-20 でラベルを無視して枠のセンターに配置 */}
                  <div className="w-full py-4 sm:py-5 flex items-center justify-center px-10 sm:px-12">
                    <p className="text-[13px] sm:text-base font-bold leading-relaxed text-slate-900 text-center relative z-20">
                      {q.options[0].text}
                    </p>
                  </div>
                </div>

                {/* スケール（6択選択ボタン） */}
                <div className="relative rounded-3xl border border-white bg-white/60 p-2 sm:p-3 shadow-[inset_0_2px_10px_rgba(0,0,0,0.03)] backdrop-blur-md">
                  <div className="grid grid-cols-6 items-start gap-1 sm:gap-1.5">
                    {answerChoices.map(choice => {
                      const isSelected = selectedChoiceIndex === choice.index;
                      const isTempSelected = tempSelectedChoiceIndex === choice.index;
                      const isDimmed = (selectedChoiceIndex !== null && !isSelected) || (tempSelectedChoiceIndex !== null && !isTempSelected);
                      const topShadow = (isSelected || isTempSelected) ? `0 0 20px 6px rgba(${topColorRGB}, 0.5)` : `0 0 8px rgba(${topColorRGB}, 0.2)`;
                      const bottomShadow = (isSelected || isTempSelected) ? `0 0 20px 6px rgba(${bottomColorRGB}, 0.5)` : `0 0 8px rgba(${bottomColorRGB}, 0.2)`;

                      return (
                        <button
                          key={choice.index}
                          type="button"
                          aria-label={choice.ariaLabel}
                          title={choice.ariaLabel}
                          disabled={selectedChoiceIndex !== null}
                          onMouseEnter={() => setHoverPos(choice.hoverPos)}
                          onMouseLeave={() => selectedChoiceIndex === null && tempSelectedChoiceIndex === null && setHoverPos(50)}
                          onClick={() => handleChoiceSelect(choice)}
                          className={`relative group flex min-w-0 flex-col items-center rounded-2xl border py-1.5 sm:py-2 transition-all duration-300 active:scale-[0.95] disabled:cursor-default ${(isSelected || isTempSelected) ? 'border-white bg-white/95 shadow-[0_0_20px_rgba(255,255,255,0.8)] z-20' : 'border-transparent hover:bg-white/80 hover:shadow-sm z-10'} ${isDimmed ? 'opacity-30 scale-95' : ''}`}
                        >
                          {/* 2タップ決定のポップアップ（チュートリアルのみ表示） */}
                          {isPractice && isTempSelected && (
                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 whitespace-nowrap bg-indigo-500/95 text-white text-[10px] sm:text-xs font-bold px-3 py-1.5 rounded-full shadow-lg z-40 animate-fade-in pointer-events-none tracking-wide flex items-center gap-1.5">
                              <span className="animate-pulse text-sm">👆</span> 2タップで決定
                            </div>
                          )}
                          <div className="relative h-24 sm:h-28 w-full flex flex-col justify-center pointer-events-none">
                            {/* 中央の線 */}
                            <div className={`absolute top-1/2 h-px -translate-y-1/2 bg-slate-200 ${choice.index === 0 ? 'left-1/2 right-0' : choice.index === answerChoices.length - 1 ? 'left-0 right-1/2' : 'left-0 right-0'}`}></div>
                            
                            {/* キャプション */}
                            <span className={`absolute left-1/2 top-1/2 z-10 -translate-x-1/2 -translate-y-1/2 whitespace-nowrap rounded-full bg-white px-2 py-1 text-[10px] sm:text-[11px] font-black leading-none transition-all duration-300 ${(isSelected || isTempSelected) ? 'text-slate-800 shadow-md ring-2 ring-slate-100 scale-110' : 'text-slate-400 shadow-sm group-hover:text-slate-600 group-hover:shadow'}`}>
                              {choice.caption}
                            </span>
                            
                            {/* 上部の玉 (A) */}
                            {choice.topSize && (
                              <div className="absolute bottom-1/2 left-0 right-0 flex justify-center pb-2">
                                <div
                                  className={`rounded-full transition-all duration-300 ${choice.topSize} ${(isSelected || isTempSelected) ? 'riesm-orb-selected ring-4 ring-white' : 'group-hover:scale-110 group-hover:-translate-y-1'}`}
                                  style={{ backgroundColor: `rgb(${topColorRGB})`, boxShadow: topShadow }}
                                ></div>
                              </div>
                            )}
                            
                            {/* 下部の玉 (B) */}
                            {choice.bottomSize && (
                              <div className="absolute top-1/2 left-0 right-0 flex justify-center pt-2">
                                <div
                                  className={`rounded-full transition-all duration-300 ${choice.bottomSize} ${(isSelected || isTempSelected) ? 'riesm-orb-selected ring-4 ring-white' : 'group-hover:scale-110 group-hover:translate-y-1'}`}
                                  style={{ backgroundColor: `rgb(${bottomColorRGB})`, boxShadow: bottomShadow }}
                                ></div>
                              </div>
                            )}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* 選択肢 B (付箋風デザイン) */}
                <div className="relative h-full w-full rounded-xl sm:rounded-2xl border border-white/70 bg-white/70 shadow-sm backdrop-blur-md flex items-center min-h-[4.5rem] overflow-hidden mt-2">
                  {/* px-10 sm:px-12 と relative z-20 でラベルを無視して枠のセンターに配置 */}
                  <div className="w-full py-4 sm:py-5 flex items-center justify-center px-10 sm:px-12">
                    <p className="text-[13px] sm:text-base font-bold leading-relaxed text-slate-900 text-center relative z-20">
                      {q.options[1].text}
                    </p>
                  </div>
                  <div
                    className="absolute top-0 right-0 h-full w-8 sm:w-10 flex items-center justify-center text-sm sm:text-base font-black text-white shadow-md z-10"
                    style={{ backgroundColor: `rgb(${bottomColorRGB})` }}
                  >
                    B
                  </div>
                </div>
              </div>

              {/* チュートリアル完了モーダル */}
              {isPractice && tutorialCompleted && (
                <div className="absolute inset-0 z-30 flex items-center justify-center bg-slate-900/40 p-4 backdrop-blur-sm animate-fade-in">
                  <div role="dialog" aria-modal="true" className="w-full max-w-sm rounded-3xl border border-white/20 bg-white p-6 sm:p-8 text-center shadow-2xl transform scale-100 transition-transform">
                    <div className="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                      <svg className="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                    </div>
                    <p className="mb-3 text-lg sm:text-xl font-extrabold leading-relaxed text-slate-800">
                      操作方法はバッチリです！
                    </p>
                    <p className="mb-6 text-[13px] sm:text-sm font-bold leading-relaxed text-slate-700">
                      このように自分の気持ちを素直に感じて選んで下さい。<br/>
                      <br/>
                      ここからが傾向確認設問です。<br/>
                      リラックスしてお進みください。
                    </p>
                    <button
                      onClick={startQuiz}
                      className={`w-full rounded-xl px-4 py-3 sm:py-4 text-sm sm:text-base font-bold shadow-sm transition-all active:scale-[0.98] ${
                        colorMode === 'colorful'
                          ? 'bg-gradient-to-r from-amber-400 to-pink-500 text-white hover:opacity-90'
                          : 'bg-gradient-to-r from-emerald-400 to-lime-400 text-emerald-950 hover:opacity-90'
                      }`}
                    >
                      準備はできたので開始する
                    </button>
                  </div>
                </div>
              )}

              <div className="mt-4 sm:mt-6 flex items-center justify-between pt-2 sm:pt-4 relative z-10 px-2">
                <button 
                  onClick={handleBack} 
                  disabled={selectedChoiceIndex !== null} 
                  className={`flex items-center gap-1.5 text-xs sm:text-sm font-bold text-slate-500 transition-all ${selectedChoiceIndex !== null ? 'opacity-30 cursor-not-allowed' : 'hover:opacity-100 hover:text-slate-800'}`}
                >
                  <ArrowLeftIcon /> もどる
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
