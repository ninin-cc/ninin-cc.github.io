<html lang="ja">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIESM™ mini</title>
  
  <link rel="stylesheet" href="./assets/tailwind.css">
  <script src="../js/linkdata.js"></script>
  <script src="../report/img/riesmQR-data.js"></script>
  
  <script src="./assets/vendor/react.production.min.js"></script>
  <script src="./assets/vendor/react-dom.production.min.js"></script>
  
  

  <!-- 画像生成用のライブラリ -->
  <script src="./assets/vendor/html2canvas.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes riesmOrbPulse {
      0% { transform: scale(1); filter: brightness(1); }
      50% { transform: scale(1.15); filter: brightness(1.15); }
      100% { transform: scale(1.05); filter: brightness(1.05); }
    }
    .riesm-orb-selected {
      animation: riesmOrbPulse 0.4s ease-out forwards;
    }
    .loading-screen { 
      display: flex; justify-content: center; align-items: center; 
      height: 100vh; font-family: sans-serif; color: #4b5563; 
    }
    /* カスタムスクロールバー（オプション） */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    /* ノート風背景のCSS */
    .notebook-bg {
      background-color: #fdfcf8;
      background-image: repeating-linear-gradient(transparent, transparent 31px, rgba(148, 163, 184, 0.3) 31px, rgba(148, 163, 184, 0.3) 32px);
      background-position: 0 10px;
    }
    /* Result-only RIESM ModeCard. Quiz content and score calculation stay unchanged. */
    .riesm-mini-mode-card {
      --mode-frame: #ffc000;
      position: relative;
      width: 100%;
      aspect-ratio: 91 / 55;
      box-sizing: border-box;
      container-type: inline-size;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: var(--mode-frame);
      box-shadow: 0 12px 26px rgba(24, 59, 91, 0.12);
      color: #183c34;
      font-family: "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
    }
    .riesm-mini-mode-card::after {
      content: "";
      position: absolute;
      inset: 1.7cqw;
      z-index: 0;
      border-radius: 3.8cqw;
      background: #fffdf8;
      pointer-events: none;
    }
    .riesm-mini-mode-card::before {
      content: "";
      position: absolute;
      inset: 2.15cqw;
      z-index: 4;
      border: 2px solid var(--mode-frame);
      border-radius: 3.35cqw;
      pointer-events: none;
    }
    .riesm-mini-mode-card__inner {
      position: absolute;
      inset: 0;
      z-index: 1;
      box-sizing: border-box;
      padding: 3.55cqw 4.2cqw 10.7cqw;
    }
    .riesm-mini-mode-card__brand {
      color: #66736e;
      font-size: 1.9cqw;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .riesm-mini-mode-card__name {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 6.2cqw;
      margin: .25cqw 0 1.15cqw;
      padding: .45cqw 12.5cqw .65cqw;
      box-sizing: border-box;
      color: #0d473b;
      font-size: 4.6cqw;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      white-space: nowrap;
    }
    .riesm-mini-mode-card__qr {
      position: absolute;
      top: 2.55cqw;
      right: 3.05cqw;
      z-index: 2;
      width: 16.5cqw;
    }
    .riesm-mini-mode-card__qr img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      margin: 0;
      object-fit: contain;
    }
    .riesm-mini-mode-card__heading {
      position: relative;
      display: block;
      margin: 2.9cqw .4cqw 1cqw;
      font-size: 0;
      line-height: 0;
    }
    .riesm-mini-mode-card__heading strong {
      font-size: 3.5cqw;
      line-height: 1;
    }
    .riesm-mini-mode-card__front,
    .riesm-mini-mode-card__back {
      color: #64716c;
      font-size: 1.9cqw;
      font-weight: 700;
    }
    .riesm-mini-mode-card__front {
      position: absolute;
      top: -.65cqw;
      right: 0;
      z-index: 5;
      line-height: 1;
      white-space: nowrap;
    }
    .riesm-mini-mode-card__graph {
      position: relative;
      padding-top: 1.8cqw;
    }
    .riesm-mini-mode-card__average-arrow {
      position: absolute;
      top: 0;
      left: var(--average-position);
      z-index: 4;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 1.35cqw solid transparent;
      border-right: 1.35cqw solid transparent;
      border-top: 2.15cqw solid #8bc34a;
    }
    .riesm-mini-mode-card__row {
      display: grid;
      grid-template-columns: 16cqw minmax(0, 1fr);
      align-items: center;
      gap: 1.55cqw;
      min-height: 6.45cqw;
      border-bottom: 1px solid #dde4e0;
    }
    .riesm-mini-mode-card__label {
      font-size: 2.55cqw;
      font-weight: 700;
      white-space: nowrap;
    }
    .riesm-mini-mode-card__track {
      position: relative;
      height: 4.5cqw;
      overflow: hidden;
      border-radius: 10px;
      background: #eef1ef;
    }
    .riesm-mini-mode-card__bar {
      height: 100%;
      border-radius: inherit;
    }
    .riesm-mini-mode-card__guide {
      position: absolute;
      left: var(--average-position);
      top: 9cqw;
      bottom: 4.8cqw;
      z-index: 0;
      width: 2px;
      transform: translateX(-50%);
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 24px,
        #cdd4d1 24px 29px,
        transparent 29px 37px
      );
      pointer-events: none;
    }
    .riesm-mini-mode-card__back {
      margin: .55cqw 0 0;
      text-align: right;
    }
    .riesm-mini-mode-card__back--left {
      text-align: right;
    }
    .riesm-mini-mode-card__footer {
      position: absolute;
      left: 4.2cqw;
      right: 4.2cqw;
      bottom: 3.45cqw;
      z-index: 2;
    }
    .riesm-mini-mode-card__creed {
      margin: 0 .2cqw;
      color: #263b35;
      font-size: 1.55cqw;
      line-height: 1.3;
      white-space: nowrap;
    }
    .riesm-mini-mode-card__creed > div + div {
      margin-top: .15cqw;
    }
    .riesm-mini-mode-card__copyright {
      position: absolute;
      right: 2.1cqw;
      bottom: .95cqw;
      z-index: 5;
      color: #fff;
      font-size: 1.35cqw;
      font-weight: 700;
      line-height: 1.15;
      text-align: right;
      white-space: nowrap;
    }
    .riesm-mini-mode-card-tools {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid #dbe5e1;
      border-radius: 14px;
      background: #f8fbfa;
    }
    .riesm-mini-mode-card-tools__row {
      display: flex;
      gap: 8px;
    }
    .riesm-mini-mode-card-tools input {
      min-width: 0;
      flex: 1;
      border: 1px solid #b9c9c3;
      border-radius: 10px;
      background: #fff;
      padding: 10px 12px;
      color: #183c34;
      font-size: 14px;
      outline: none;
    }
    .riesm-mini-mode-card-tools input:focus {
      border-color: #0d6b59;
      box-shadow: 0 0 0 3px rgba(13, 107, 89, .12);
    }
    .riesm-mini-mode-card-tools button {
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      transition: transform .15s ease, opacity .15s ease;
    }
    .riesm-mini-mode-card-tools button:active {
      transform: scale(.98);
    }
    .riesm-mini-mode-card-tools__apply {
      background: #0d6b59;
      color: #fff;
    }
    .riesm-mini-mode-card-tools__save {
      width: 100%;
      margin-top: 9px;
      background: #183b5b;
      color: #fff;
    }
    .riesm-mini-mode-card-tools button:disabled {
      cursor: wait;
      opacity: .58;
    }
    @media (max-width: 390px) {
      .riesm-mini-mode-card-tools__row {
        flex-direction: column;
      }
    }
    .riesm-history-blocks {
      display: inline-flex;
      gap: 3px;
      align-items: center;
      flex: none;
    }
    .riesm-history-block {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .08);
    }
    .riesm-history-trend {
      overflow-x: hidden;
    }
    .riesm-history-trend__svg {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: auto;
    }
    .riesm-history-trend__svg--desktop {
      display: none;
    }
    @media (min-width: 640px) {
      .riesm-history-trend {
        overflow-x: auto;
      }
      .riesm-history-trend__svg--mobile {
        display: none;
      }
      .riesm-history-trend__svg--desktop {
        display: block;
        min-width: 620px;
      }
    }
    .riesm-guide-image {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
    }
  </style>
</head>
<body class="bg-gray-50 text-slate-800 font-sans antialiased selection:bg-indigo-100 selection:text-indigo-900">
  
  <div id="root">
    <div class="loading-screen">
      <div class="animate-pulse flex flex-col items-center gap-3">
        <span class="text-3xl">🌈</span>
        <span class="text-sm font-bold tracking-widest text-slate-400">システムを起動中...</span>
      </div>
    </div>
  </div>
  <script src="./assets/app.js"></script>
</body>
</html>
